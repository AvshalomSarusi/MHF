<!DOCTYPE html>
<html dir="rtl" lang="he">

<head>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>MHF הודעות</title>
    <link rel="stylesheet" href="/CSS/theme.css">
    <link rel="stylesheet" href="/CSS/guardianMessages.css">
</head>

<body>
    <script>try{if(document.cookie.split('; ').indexOf('mhf_role=admin')>-1){document.body.classList.add('admin')}}catch(e){}</script>
    <a class="brand app-brand" href="/p">My Healthy Family</a>
    <div class="menu">
        <button id="menueBtn">תפריט</button>

        <div id="menuItem" class="menu-items">
            <button onclick="location.href='/p'">פרופיל</button>
            <button onclick="location.href='/ccp'">כרטיס בן משפחה</button>
            <button onclick="location.href='/e'">עריכה</button>
            <button onclick="location.href='/h'">היסטוריית תרופות</button>
            <button onclick="location.href='/changePass'">שינוי סיסמה</button>
            <button onclick="location.href='/logout'">התנתקות</button>
        </div>
    </div>
    <div id="guardianMessagesBox">
        <h2>שליחת הודעה לאפוטרופוס</h2>

        <select id="guardianSelect">
            <option value="" disabled selected hidden>בחר אפוטרופוס</option>
        </select>
        <br><br>
        <input type="text" id="messageSubject" placeholder="נושא">
        <br><br>
        <textarea id="messageBody" placeholder="כתבו כאן את ההודעה שלכם"></textarea>
        <br><br>
        <button onclick="sendGuardianToMessage()">שליחת הודעה</button>

    </div>
    <script src="/JS/guardianMessages.js"></script>
    <script src="/JS/menu.js"></script>
</body>

</html>
