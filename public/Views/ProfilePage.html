<!DOCTYPE html>
<html dir="rtl" lang="he">

<head>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>MHF פרופיל</title>
    <link rel="stylesheet" href="/CSS/theme.css">
    <link rel="stylesheet" href="/CSS/profile.css">
</head>

<body>
    <script>try{if(document.cookie.split('; ').indexOf('mhf_role=admin')>-1){document.body.classList.add('admin')}}catch(e){}</script>
    <a class="brand app-brand" href="/p">My Healthy Family</a>
    <!--כפתור לפתיכת התפריט-->
    <div class = "menu">
        <button id="menueBtn">תפריט</button>

        <div id="menuItem" class="menu-items">
            <button onclick="location.href='/ccp'">כרטיס בן משפחה</button>
            <button onclick="location.href='/e'">עריכה</button>
            <button onclick="location.href='/h'">היסטוריית תרופות</button>
            <button onclick="location.href='/gm'">הודעה לאפוטרופוס</button>
            <button onclick="location.href='/changePass'">שינוי סיסמה</button>
            <button onclick="location.href='/logout'">התנתקות</button>
        </div>
    </div>

    <h2 id="hello"></h2><br>

    <!--כפטור להכנסת ילד או בן משפחה-->
    <div id="addButton">
        <button id="createRelative">הוספת בן משפחה</button>
        <button id="createMedication">הוספת תרופה</button>
    </div><br>

    <!--טבלה להכנסת ילד או בן משפחה חדש-->
    <table id="relativeTable" border="1" style="display:none;">
        <tr>
            <th>שם בן המשפחה</th>
            <th>שמירה</th>
        </tr>
        <tbody id="relativeTableBody"></tbody>
    </table>

    <!--טבלה להכנסת תרופה חדשה-->
    <table id="medicationTable" border="1" style="display:none;">
        <tr>
            <th>שם התרופה</th>
            <th>אנטיביוטיקה</th>
            <th>שמירה</th>
        </tr>
        <tbody id="medicationTableBody"></tbody>
    </table>

    <p>הוספת אירוע חדש</p>
    <!--בחירת בן משפחה -->
    <div class="form-row">
        <select id="childSelect1">
            <option value="" disabled selected hidden>בחר בן משפחה</option>
        </select>

        <!--בחירת תרופה-->
        <select id="medicationSelect">
            <option value="" disabled selected hidden>בחר תרופה</option>
        </select>
        <input type="text" id="dosage" placeholder="מינון (למשל 8 מ&quot;ל)">
        שעה לשליחה: <input type="time" id="timeToSend" placeholder="שעה לשליחת ההודעה">
        <button id="addMedication">הוספה</button>
    </div><br>

    <!--הוספת שמרטף/בייביסיטר/מטפל וכו-->
    <p>הוספת אפוטרופוס חדש</p>
    <div class="form-row">
        <input type="text" id="guardianName" placeholder="שם האפוטרופוס">
        <input type="text" id="guardianRelationship" placeholder="קרבה (למשל בייביסיטר)">
        <input type="email" id="guardianEmail" placeholder="אימייל האפוטרופוס">
        <button id="addGuardian">הוספת אפוטרופוס</button>
    </div><br>

    <p>שיוך אפוטרופוס לבן משפחה</p>
    <div class="form-row">
        <select id="childSelect2">
            <option value="" disabled selected hidden>בחר בן משפחה</option>
        </select>
        <select id="guardianChildSelect">
            <option value="" disabled selected hidden>בחר אפוטרופוס</option>
        </select>
        <button id="saveGurdianForRelative">שמירה</button>
    </div><br><br>

    <!--טבלת המציגה את הנתונים של בן המשפחה והתרופה-->
    <p>
        טבלה זו מציגה את משימות התרופות המתוזמנות לכל בן משפחה, כולל שם התרופה, המינון, השעה והאפוטרופוס המשויך.
    </p>
    <div id="tableBox">
    <table border="1">
        <tr>
            <th>בן משפחה</th>
            <th>תרופה</th>
            <th>מינון</th>
            <th>שעת נטילה</th>
            <th>אפוטרופוס</th>
        </tr>
        <tbody id="logsTableBody"></tbody>
    </table>
    </div>
    <script src="JS/profile.js"></script>
    <script src="/JS/menu.js"></script>
</body>

</html>
