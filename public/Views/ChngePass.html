<!DOCTYPE html>
<html dir="rtl" lang="he">

<head>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>MHF שינוי סיסמה</title>
    <link rel="stylesheet" href="/CSS/theme.css">
    <link rel="stylesheet" href="/CSS/LoginPage.css">
</head>

<body class="auth">
    <main class="auth-shell">
        <section class="auth-card">
            <span class="brand">My Healthy Family</span>
            <h1>שינוי הסיסמה שלך</h1>
            <p class="auth-sub">הזינו את הפרטים שלכם כדי להגדיר סיסמה חדשה.</p>

            <form action="/changePass" method="post">
                <input type="text" id="name" name="name" placeholder="שם פרטי"><br>
                <input type="text" id="lname" name="lname" placeholder="שם משפחה"><br>
                <input type="email" id="email" name="email" placeholder="אימייל"><br>
                <input type="password" id="pass1" name="pass1" placeholder="סיסמה ישנה"><br>
                <input type="password" id="pass2" name="pass2" placeholder="סיסמה חדשה"><br>
                <button type="submit">שינוי סיסמה</button>
            </form>
        </section>
    </main>
</body>

</html>
