<!DOCTYPE html>
<html>

<head>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta charset="UTF-8">

    <title>MHF Edit</title>
    <link rel="stylesheet" href="css/edit.css">
</head>

<body>
    <h2>Edit page</h2><br>
    <!--טבלת עריכה ומחיקת מסימות-->
    <div class="menu">
        <button id="menueBtn">Menu</button>

        <div id="menuItem" class="menu-items">
            <button id="btnP" onclick="location.href='/p'">Profile</button>
            <button onclick="location.href='/h'">Medication History</button>
            <button id="btnGM"onclick="location.href='/gm'">Guardian message</button>
            <button onclick="location.href='/logout'">Logout</button>
        </div>
    </div>
    <div id="tableBox">
        <p>
            You can change the dosage and medication time here by clicking the Edit button.<br>
            You can also delete the task by clicking the Delete button.
        </p>
        <table border="1">
            <tr>
                <th>Relative</th>
                <th>Medication</th>
                <th>Dosage</th>
                <th>Time to get</th>
                <th>Guardian</th>
                <th>Edit</th>
                <th>Delete</th>
            </tr>
            <tbody id="logsTableBody"></tbody>
        </table>
    </div>   
     <h2>Delete information and data</h2>
    <hr>
    <!--מחיקת שמרטפים-->
    <div id="deleteGuardianBox">
        <p>Delete guardian</p>
    
        <select id="guardianToDelete">
            <option value="" disabled selected hidden>Select Guardian</option>
        </select>
    
        <button onclick="deleteGuardian()">Delete Guardian</button>
    </div>
    <hr>
    <!--בחירת תרופה ומחיקתה-->
    <div id="deleteMedicationBox">
        <p>Delete medication</p>
        <select id="medicationToDelete">
            <option value="" disabled selected hidden>Select Medication</option>
        </select>
        <button onclick="deleteMedication()">Delete Medication</button>
    </div>
    <hr>
    <!--מחיקת בן משפחה-->
    <div id="deleteRelativeBox">
        <p>Delete relative</p>
        <select id="relativeToDelete">
            <option value="" disabled selected hidden>Select Relative</option>
        </select>
        <button onclick="deleteRelative()">Delete Relative</button>
    </div>
    <hr>
    <script src="/JS/edit.js"></script>
    <script src="/JS/menu.js"></script>
</body>

</html>
