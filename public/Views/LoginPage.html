<!DOCTYPE html>
<html dir="rtl" lang="he">

<head>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>MHF כניסה</title>
    <link rel="stylesheet" href="/CSS/theme.css">
    <link rel="stylesheet" href="/CSS/LoginPage.css">
</head>

<body class="auth">
    <!--My Healthy Family-->
    <div id="createAccount">
        <button id="regbutt" onclick="window.location.href='/register'">יצירת חשבון</button>
    </div>

    <main class="auth-shell">
        <section class="auth-card">
            <span class="brand">My Healthy Family</span>
            <h1>ברוכים השבים</h1>
            <p class="auth-sub">התחברו כדי לשמור על מתן התרופות של המשפחה בזמן.</p>

            <form action="/" method="post">
                <input type="text" id="nickname" name="nickname" placeholder="שם פרטי"><br>
                <input type="password" id="pass" name="pass" placeholder="סיסמה"><br>
                <button type="submit">כניסה</button>
            </form>

            <p class="auth-note">
                אתר זה משתמש בעוגיות חיוניות לצורך התחברות מאובטחת וזיהוי המשתמש.<br>
                <strong>חשוב:</strong> אנא זכרו להתנתק בסיום השימוש באתר.
            </p>
        </section>
    </main>
</body>

</html>
